name: Build (direct PlatformIO)

# Fork of build_firmware.yml that compiles with pip-installed PlatformIO
# directly on the GitHub-hosted runner, instead of the meshtastic/
# gh-action-firmware Docker container. The develop-* images regressed on
# 2026-10-12 (image rev c48ef2c): /pio/core/penv has no pip, so every
# ESP-family build dies at link with
#   ModuleNotFoundError: No module named 'SCons.Tool.FortranCommon'
# This workflow uses the repo's own bin/build-<arch>.sh scripts so the
# release/ directory is populated exactly like upstream packaging expects
# (mtjson target, device-install scripts, nRF factory-erase uf2, OTA zip).
#
# Inputs and outputs are IDENTICAL to build_firmware.yml, so callers can
# switch between them with a one-line `uses:` change.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      platform:
        required: true
        type: string
      pio_env:
        required: true
        type: string

permissions: read-all

jobs:
  pio-build:
    name: build-${{ inputs.platform }}
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload-firmware.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      # Warm ~/.platformio per platform: avoids re-downloading toolchains on
      # every run and dodges PlatformIO registry rate limits on cold caches.
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ inputs.platform }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ inputs.platform }}-

      - name: Install PlatformIO
        # PINNED: PlatformIO Core 6.2.0 (PyPI latest since 2026-09-05) wipes
        # tool-scons during ESP-IDF builds — link then dies with
        # "ModuleNotFoundError: SCons.Tool.FortranCommon" (community thread
        # 54324; reproduced locally at 484s). 6.1.19 is the last known-good
        # (matches Jenny's local builds). Do not un-pin until 6.2.1+ ships.
        run: pip install -U platformio==6.1.19

      - name: Build ${{ inputs.platform }}
        id: build
        env:
          PIP_BREAK_SYSTEM_PACKAGES: "1"
        run: |
          case "${{ inputs.platform }}" in
            esp32|esp32s3|esp32c3|esp32c6) SCRIPT=bin/build-esp32.sh ;;
            nrf52840)                      SCRIPT=bin/build-nrf52.sh ;;
            nrf54l15)                      SCRIPT=bin/build-nrf54l15.sh ;;
            rp2040|rp2350)                 SCRIPT=bin/build-rp2xx0.sh ;;
            stm32)                         SCRIPT=bin/build-stm32wl.sh ;;
            *)
              echo "::error::No build script mapped for platform '${{ inputs.platform }}'"
              exit 1
              ;;
          esac
          echo "Using $SCRIPT for env ${{ inputs.pio_env }}"
          bash "$SCRIPT" "${{ inputs.pio_env }}"

      - name: ESP32 - Download Unified OTA firmware
        # Currently only esp32 and esp32s3 use the unified ota
        if: inputs.platform == 'esp32' || inputs.platform == 'esp32s3'
        id: dl-ota-unified
        env:
          PIO_PLATFORM: ${{ inputs.platform }}
          PIO_ENV: ${{ inputs.pio_env }}
          OTA_URL: https://github.com/meshtastic/esp32-unified-ota/releases/latest/download/mt-${{ inputs.platform }}-ota.bin
        working-directory: release
        run: |
          curl -L -o "mt-$PIO_PLATFORM-ota.bin" $OTA_URL

      - name: ESP32-C* - Download BLE-Only OTA firmware
        if: inputs.platform == 'esp32c3' || inputs.platform == 'esp32c6'
        id: dl-ota-ble
        env:
          PIO_ENV: ${{ inputs.pio_env }}
          OTA_URL: https://github.com/meshtastic/firmware-ota/releases/latest/download/firmware-c3.bin
        working-directory: release
        run: |
          curl -L -o bleota-c3.bin $OTA_URL

      - name: Update manifest with OTA file
        if: inputs.platform == 'esp32' || inputs.platform == 'esp32s3' || inputs.platform == 'esp32c3' || inputs.platform == 'esp32c6'
        working-directory: release
        env:
          PIO_PLATFORM: ${{ inputs.platform }}
        run: |
          # Determine OTA filename based on platform
          if [[ "$PIO_PLATFORM" == "esp32" || "$PIO_PLATFORM" == "esp32s3" ]]; then
            OTA_FILE="mt-${PIO_PLATFORM}-ota.bin"
          else
            OTA_FILE="bleota-c3.bin"
          fi

          # Check if OTA file exists
          if [[ ! -f "$OTA_FILE" ]]; then
            echo "OTA file $OTA_FILE not found, skipping manifest update"
            exit 0
          fi

          # Calculate MD5 and size
          if command -v md5sum &> /dev/null; then
            OTA_MD5=$(md5sum "$OTA_FILE" | cut -d' ' -f1)
          else
            OTA_MD5=$(md5 -q "$OTA_FILE")
          fi
          OTA_SIZE=$(stat -f%z "$OTA_FILE" 2>/dev/null || stat -c%s "$OTA_FILE")

          # Find and update manifest file
          for manifest in firmware-*.mt.json; do
            if [[ -f "$manifest" ]]; then
              echo "Updating $manifest with $OTA_FILE (md5: $OTA_MD5, bytes: $OTA_SIZE)"
              jq --arg name "$OTA_FILE" --arg md5 "$OTA_MD5" --argjson bytes "$OTA_SIZE" --arg part "app1" \
                'if .files | map(select(.name == $name)) | length == 0 then .files += [{"name": $name, "md5": $md5, "bytes": $bytes, "part_name": $part}] else . end' \
                "$manifest" > "${manifest}.tmp" && mv "${manifest}.tmp" "$manifest"
            fi
          done

      - name: Job summary
        env:
          PIO_ENV: ${{ inputs.pio_env }}
        run: |
          echo "## $PIO_ENV" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary><strong>Manifest</strong></summary>" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat release/firmware-*.mt.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY

      - name: Store binaries as an artifact
        uses: actions/upload-artifact@v7
        id: upload-firmware
        with:
          name: firmware-${{ inputs.platform }}-${{ inputs.pio_env }}-${{ inputs.version }}
          overwrite: true
          path: |
            release/*.mt.json
            release/*.bin
            release/*.elf
            release/*.uf2
            release/*.hex
            release/*.zip
            release/device-*.sh
            release/device-*.bat

      - name: Store manifests as an artifact
        uses: actions/upload-artifact@v7
        id: upload-manifest
        with:
          name: manifest-${{ inputs.platform }}-${{ inputs.pio_env }}-${{ inputs.version }}
          overwrite: true
          path: |
            release/*.mt.json
