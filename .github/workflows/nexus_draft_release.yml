name: Nexus Draft Release

# Builds the firmware matrix and assembles a DRAFT GitHub release with
# per-arch firmware zips attached. Publishing the draft is a manual step
# (publishing fires release_channels.yml, so keep the title in mind:
# 'Beta'/'Alpha' in the title selects that packaging channel).
#
# Unlike the upstream release path (main_matrix.yml), nothing here is gated
# on github.repository_owner — it runs on any fork. Build failures do not
# block the draft: whatever compiled gets attached.
#
# NOTE: top-level `permissions: read-all` is REQUIRED here (mirrors
# main_matrix.yml). The called build workflow (nexus_build_firmware.yml)
# declares `permissions: read-all`; the
# caller must grant at least that much, otherwise GitHub rejects the run with
# startup_failure before any job starts ('The workflow is requesting ...').
# Narrowing it (e.g. contents: write) OR omitting it (falls back to the repo's
# restricted default) both fail. Write access lives on the draft-release job
# only — same pattern as main_matrix's release-artifacts job.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release — type an existing tag (e.g. v2.8.103) or leave EMPTY when dispatched on a tag ref (the tag must already contain this workflow file, otherwise pick a branch and type the tag here)"
        required: false
        default: ""
        type: string
      title:
        description: "Release title for a NEW release (empty = use the tag)"
        required: false
        default: ""
        type: string
      boards:
        description: "Board set to build"
        required: true
        default: release
        type: choice
        options:
          - release   # pr + release boards (the normal set)
          - pr        # PR subset only (fast)
          - extra     # everything, incl. opt-in boards
      prerelease:
        description: "Mark the draft as a prerelease (new releases only)"
        required: true
        default: true
        type: boolean

concurrency:
  group: nexus-draft-release-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          cache: pip
      - run: pip install -U platformio
      - name: Generate matrix
        id: jsonStep
        run: |
          FLAG=""
          if [[ "${{ inputs.boards }}" == "pr" ]]; then FLAG="--level pr"; fi
          if [[ "${{ inputs.boards }}" == "extra" ]]; then FLAG="--level extra"; fi
          TARGETS=$(./bin/generate_ci_matrix.py all $FLAG)
          echo "Name: $GITHUB_REF_NAME"
          echo "all=$TARGETS" >> "$GITHUB_OUTPUT"
          echo "$TARGETS" >> "$GITHUB_STEP_SUMMARY"
    outputs:
      all: ${{ steps.jsonStep.outputs.all }}

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Get release version string
        id: version
        env:
          BUILD_LOCATION: local
        run: |
          echo "long=$(./bin/buildinfo.py long)" >> "$GITHUB_OUTPUT"
          echo "deb=$(./bin/buildinfo.py deb)" >> "$GITHUB_OUTPUT"
      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              TAG="$GITHUB_REF_NAME"
            else
              echo "::error::No tag given and this run was not dispatched on a tag. Pick a tag in 'Run workflow from' or fill the tag field."
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "🏷️ Release tag: $TAG" >> "$GITHUB_STEP_SUMMARY"
    outputs:
      long: ${{ steps.version.outputs.long }}
      deb: ${{ steps.version.outputs.deb }}
      tag: ${{ steps.tag.outputs.tag }}

  build:
    needs: [setup, version]
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJson(needs.setup.outputs.all) }}
    uses: ./.github/workflows/nexus_build_firmware.yml
    with:
      version: ${{ needs.version.outputs.long }}
      pio_env: ${{ matrix.build.board }}
      platform: ${{ matrix.build.platform }}

  draft-release:
    name: Create draft release
    needs: [version, build]
    # Individual build failures must not block a partial release.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check tag and release state
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "📌 Tag \`$TAG\` already exists — it will be used as-is." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "🏷️ Tag \`$TAG\` does not exist — it will be created at \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "📦 A release for \`$TAG\` already exists — artifacts will be attached to it, its state stays untouched." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "📦 No visible release for \`$TAG\` — a new draft will be created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*-${{ needs.version.outputs.long }}
          path: ./artifacts
          if-no-artifacts-found: ignore

      - name: Zip firmware per architecture
        id: zips
        run: |
          mkdir -p ./zips
          VERSION="${{ needs.version.outputs.long }}"
          shopt -s nullglob
          for arch in esp32 esp32s3 esp32c3 esp32c6 nrf52840 rp2040 rp2350 stm32; do
            dirs=(./artifacts/firmware-${arch}-*)
            if (( ${#dirs[@]} > 0 )); then
              # NOTE: no -j (junk paths)! With -j, files that share a basename
              # across env dirs (e.g. Meshtastic_nRF52_factory_erase_*.uf2)
              # collide and zip exits 16 ('cannot repeat names in zip file').
              # Keeping paths preserves per-env provenance and avoids clashes.
              zip -9 -r "./zips/firmware-${arch}-${VERSION}.zip" "${dirs[@]}"
            else
              echo "no artifacts for ${arch}, skipping"
            fi
          done
          {
            echo "files<<EOF"
            ls -1 ./zips/*.zip 2>/dev/null || true
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          ls -lR ./zips ./artifacts | head -100

      - name: Generate release notes
        id: notes
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./bin/generate_release_notes.py
          ./bin/generate_release_notes.py "${{ needs.version.outputs.long }}" --compare-ref HEAD > ./notes.md \
            || echo "Nexus draft release ${{ needs.version.outputs.tag }}" > ./notes.md
          head -50 ./notes.md

      - name: Attach artifacts to existing release
        if: steps.rel.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(./zips/*.zip)
          if (( ${#files[@]} == 0 )); then
            echo "No zips to attach (no builds produced artifacts)."
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      - name: Create draft release (with artifacts)
        if: steps.rel.outputs.release_exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.title != '' && inputs.title || needs.version.outputs.tag }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          body_path: ./notes.md
          files: ${{ steps.zips.outputs.files }}
