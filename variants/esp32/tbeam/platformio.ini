; The 1.0 release of the TBEAM board 
[env:tbeam]
custom_meshtastic_hw_model = 4
custom_meshtastic_hw_model_slug = TBEAM
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = LILYGO T-Beam
custom_meshtastic_images = tbeam.svg
custom_meshtastic_tags = LilyGo

extends = esp32_base
board_level = release
board = ttgo-tbeam

; Nexus-28005 (2026-09-15): weight-reduction for plain t-beam (ESP32, has display).
; Mirrors the Nexus-28001 rak3401-1watt commit (63ce9cd2f) minus the two display
; flags (HAS_SCREEN / HAS_DISPLAY) — t-beam has an SSD1306 OLED.
;
; Three layers:
;   1. -DNEXUS_SENSOR_WEIGHTREDUCTION=3 — HEAVY tier from NexusSensorBudget.h;
;      drops air quality + health + detection + environment + power via the
;      umbrella force-include in src/modules/Modules.cpp + NexusModule.cpp.
;   2. 12 module MESHTASTIC_EXCLUDE_* drops (the standard promicro sx1262 set).
;   3. 5 belt-and-suspenders MESHTASTIC_EXCLUDE_* sensor flags for TUs not
;      covered by the umbrella (e.g. ScanI2CTwoWire.cpp).
;
; Follows the NEXUS_SENSOR_WEIGHTREDUCTION UMBRELLA RULE and the
; JENTASTIC_EXCLUDE_<FAMILY> PER-FAMILY RULE.
build_flags = ${esp32_base.build_flags}
  -D TBEAM_V10
  -D HAS_NEXUS=1
  -D NEXUS_SENSOR_WEIGHTREDUCTION=3
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1
  -I variants/esp32/tbeam

upload_speed = 921600

[env:tbeam-displayshield]
extends = env:tbeam
board_level = extra
build_flags =
  ${env:tbeam.build_flags}
  -D USE_ST7796

lib_deps =
  ${env:tbeam.lib_deps}
  # renovate: datasource=github-tags depName=meshtastic-st7796 packageName=meshtastic/st7796
  https://github.com/meshtastic/st7796/archive/1.0.5.zip
  # renovate: datasource=custom.pio depName=SensorLib packageName=lewisxhe/library/SensorLib
  lewisxhe/SensorLib@0.4.1
