; ESP32 C3 Super Mini Development Board
; https://www.espboards.dev/esp32/esp32-c3-super-mini/
[env:xiaowa-esp32c3]
extends = esp32c3_base
board = esp32-c3-devkitm-1
build_flags =
  ${esp32c3_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32c3/diy/xiaowa-esp32c3
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; === Mandatory Nexus flags ===
  -DHAS_NEXUS=1
  -DNEXUS_ENABLE_AIRTAG
  ; === Headless mode (Nexus-28002, 2026-08-23) ===
  ; SSD1306Wire.h in meshtastic/esp8266-oled-ssd1306 at pinned commit
  ; ace0fcbc is missing the CONFIG_IDF_TARGET_ESP32C3 guard that
  ; upstream ThingPulse already has, so any Wire1 reference crashes
  ; the C3 build. MESHTASTIC_EXCLUDE_SCREEN short-circuits Screen.h
  ; before it falls through to AutoOLEDWire.h (which uses the same
  ; broken code path). Same macro used by 15+ no-screen variants
  ; (rak3401_1watt, tlora_c6, mesh-tab, etc.). Long-term fix is
  ; upstream PR to meshtastic/esp8266-oled-ssd1306 adding the C3
  ; guard, but until that lands we drop display entirely.
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_DISPLAY=1   ; forward-compat no-op (same pattern; rak3401 has it)
#  -DMESHTASTIC_EXCLUDE_GPS=1       ; variant.h already has HAS_GPS 0, belt-and-suspenders
  ; === All 4 on-flash databases excluded (Nexus-28002, 2026-08-23) ===
  ; Headless node with no UI to surface position/telemetry/environment/
  ; status anyway. Saves flash + RAM by not building NodeDBLite-style
  ; warming caches. mesh-pb-constants.h defaults all 4 to 0 (enabled)
  ; on non-STM32WL; we override all 4.
  -DMESHTASTIC_EXCLUDE_POSITIONDB=1
  -DMESHTASTIC_EXCLUDE_TELEMETRYDB=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTDB=1
  -DMESHTASTIC_EXCLUDE_STATUSDB=1
  ; === Node count cap (Nexus-28002, 2026-08-23) ===
  ; C3 default in mesh-pb-constants.h is 120 (line 124, generic ESP32
  ; branch). Drop to 50 — headless / relay use cases don't need 120
  ; tracked peers, and each node entry costs ~130 B per NodeInfoLite
  ; (the static_assert on line 63 of mesh-pb-constants.h). 50 keeps
  ; 130 B * 50 = ~6.5 KB of hot store flash, well under C3's 4 MB budget.
  -DMAX_NUM_NODES=50
  ; === Headless weight reduction (Nexus-28002, 2026-08-23) ===
  ; C3 has limited flash (4 MB) and tiny heap (320 KB) — strip every
  ; module not strictly required for a stealth relay/headless node.
  ; Mirrors rak3401_1watt pattern verbatim, minus rak3401's
  ; nRF52-specific RADIOLIB_EXCLUDE_* flags (C3 still needs SX126x).
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1   ; already on this variant, kept for clarity
  -DMESHTASTIC_EXCLUDE_BEACON=1         ; both Beacon variants (single macro covers both)
  -DMESHTASTIC_EXCLUDE_STATUS=1         ; status module (STATUSDB already excluded above)
  -DMESHTASTIC_EXCLUDE_TRAFFIC_MANAGEMENT=1   ; forwarder/ignore/packet-mode knobs (HAS_TRAFFIC_MANAGEMENT gate)
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1

board_level = extra
