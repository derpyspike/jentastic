[env:cutretech-esp32s3]
custom_meshtastic_hw_model = 54
custom_meshtastic_hw_model_slug = EBYTE_ESP32_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = CutreTech ESP32-S3
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board_level = release
board = seeed-xiao-s3
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
build_flags =
  ${esp32s3_base.build_flags}
  -D EBYTE_ESP32_S3
  -I variants/esp32s3/cutretech-esp32s3
  -DBOARD_HAS_PSRAM
; -hybrid subvariant (2026-10-31): shares every build flag of cutretech-esp32s3 and
; additionally enables JenCore + RNode the way build-nexus.sh would:
; -DNEXUS_ENABLE_JENCORE=1 -UCRYPTO_AES_NO_DECRYPT -DNEXUS_ENABLE_RNODE=1
[env:cutretech-esp32s3-hybrid]
custom_meshtastic_hw_model = 54
custom_meshtastic_hw_model_slug = EBYTE_ESP32_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = CutreTech ESP32-S3 Hybrid
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB
extends = env:cutretech-esp32s3
build_flags =
  ${env:cutretech-esp32s3.build_flags}
  -DNEXUS_ENABLE_JENCORE=1
  -UCRYPTO_AES_NO_DECRYPT
  -DNEXUS_ENABLE_RNODE=1
