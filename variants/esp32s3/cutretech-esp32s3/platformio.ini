[env:cutretech-esp32s3]
custom_meshtastic_hw_model = 54
custom_meshtastic_hw_model_slug = EBYTE_ESP32_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = CutreTech ESP32-S3
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB

extends = esp32s3_base
board_level = release
board = seeed-xiao-s3
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
build_flags =
  ${esp32s3_base.build_flags}
  -D EBYTE_ESP32_S3
  -I variants/esp32s3/cutretech-esp32s3
  -DBOARD_HAS_PSRAM
; -hybrid subvariant (2026-10-31): shares every build flag of cutretech-esp32s3 and
; additionally enables JenCore + RNode the way build-nexus.sh would:
; -DNEXUS_ENABLE_JENCORE=1 -UCRYPTO_AES_NO_DECRYPT -DNEXUS_ENABLE_RNODE=1
[env:cutretech-esp32s3-hybrid]
custom_meshtastic_hw_model = 54
custom_meshtastic_hw_model_slug = EBYTE_ESP32_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = CutreTech ESP32-S3 Hybrid
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB
extends = env:cutretech-esp32s3
build_flags =
  ${env:cutretech-esp32s3.build_flags}
  -DNEXUS_ENABLE_JENCORE=1
  -UCRYPTO_AES_NO_DECRYPT
  -DNEXUS_ENABLE_RNODE=1

[env:cutretech-esp32s3-mrrns]
extends = env:cutretech-esp32s3
board_level = extra
lib_deps =
  ${env:cutretech-esp32s3.lib_deps}
  https://github.com/attermann/microReticulum/archive/40fa628809d57140180c1c833559ab96fec992c1.zip
  https://github.com/meshtastic/Crypto/archive/1c817c2f27aa4593e07d0f7e13b3dbf8d980bcae.zip
  https://github.com/attermann/microStore/archive/0f28567fe00ab8ab14624a34c2e9e0a000a44c46.zip
build_flags =
  ${env:cutretech-esp32s3.build_flags}
  -DNEXUS_ENABLE_RNODE=1
  -DNEXUS_ENABLE_MICRORETICULUM=1
  -DNEXUS_ENABLE_RNS_HYBRID_SYNC=1
  -DRNS_USE_FS
  -DUSTORE_USE_UNIVERSALFS
  -DMCU_ESP32
  -DRNG=CryptRNG
  -DMSGPACK_USE_BOOST=OFF
  -DRNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR
  -DRNS_CONTAINER_ALLOCATOR=RNS_PSRAM_ALLOCATOR

; -jenwan subvariant: native LoRaWAN end-device persona (JenWAN). Keeps every
; cutretech flag and enables the RadioLib LoRaWAN stack that the global env
; excludes. All runtime settings live in /jenwan.bin via /nexus JW.
[env:cutretech-esp32s3-jenwan]
extends = env:cutretech-esp32s3
board_level = extra
build_flags =
  ${env:cutretech-esp32s3.build_flags}
  -DNEXUS_ENABLE_JENWAN=1
  -URADIOLIB_EXCLUDE_LORAWAN
