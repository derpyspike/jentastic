; Seeed XIAO ESP32-S3 + NiceRF LR2021 (Javi LR2021).
; Same castellated pinout as the LR1121 Javi variant; the radio driver and the
; internal LR2021 RF-switch DIO table differ.
;
; 2.4 GHz PA enable: the vendor drives DIO7 as a static high GPIO. The pre:
; script bin/apply_radiolib_dio7_paen.py inserts the matching block into the
; env's RadioLib after it is installed; radiolib-dio7-paen.patch is the same
; change for reference. Sub-GHz works either way.
[env:diy-seeed-xiao-s3-nicerf-lr2021]
extends = esp32s3_base
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board_level = extra
board = seeed-xiao-s3
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
platform_packages =
  ${esp32s3_base.platform_packages}
  platformio/tool-scons@4.41101.0
extra_scripts =
  ${esp32s3_base.extra_scripts}
  pre:bin/apply_radiolib_dio7_paen.py
custom_meshtastic_hw_model = 81
custom_meshtastic_hw_model_slug = SEEED_XIAO_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_display_name = Javi LR2021
custom_meshtastic_tags = Javi, Seeed
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB
build_flags =
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -I variants/esp32s3/diy/seeed-xiao-s3-nicerf-lr2021
  -DBOARD_HAS_PSRAM
  -D LR2021_DIO7_PAEN_ALWAYS_HIGH

; Native microReticulum transport node on the Javi LR2021. On LR2021 the RNode
; traffic is received by a TIER RNODE side detector (the main detector keeps the
; Meshtastic syncword), so this mirrors cutretech-esp32s3-lr2021-mrrns and does
; not use NEXUS_ENABLE_RNS_HYBRID_SYNC.
[env:diy-seeed-xiao-s3-nicerf-lr2021-mrrns]
extends = env:diy-seeed-xiao-s3-nicerf-lr2021
board_level = extra
lib_deps =
  ${env:diy-seeed-xiao-s3-nicerf-lr2021.lib_deps}
  https://github.com/attermann/microReticulum/archive/40fa628809d57140180c1c833559ab96fec992c1.zip
  https://github.com/meshtastic/Crypto/archive/1c817c2f27aa4593e07d0f7e13b3dbf8d980bcae.zip
  https://github.com/attermann/microStore/archive/0f28567fe00ab8ab14624a34c2e9e0a000a44c46.zip
build_flags =
  ${env:diy-seeed-xiao-s3-nicerf-lr2021.build_flags}
  -DNEXUS_ENABLE_RNODE=1
  -DNEXUS_ENABLE_MICRORETICULUM=1
  -DRNS_USE_FS
  -DUSTORE_USE_UNIVERSALFS
  -DMCU_ESP32
  -DRNG=CryptRNG
  -DMSGPACK_USE_BOOST=OFF
  -DRNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR
  -DRNS_CONTAINER_ALLOCATOR=RNS_PSRAM_ALLOCATOR
