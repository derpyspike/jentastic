; Seeed XIAO ESP32-S3 + NiceRF LoRa1121F33-2G4 (LR1121 + 30 dBm FEM).
; Local DIY variant (diy- prefix) so it stays distinct from the stock seeed-xiao-s3 env.
[env:diy-seeed-xiao-s3-nicerf1121]
extends = esp32s3_base
board_level = extra
board = seeed-xiao-s3
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
custom_meshtastic_hw_model = 81
custom_meshtastic_hw_model_slug = SEEED_XIAO_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_display_name = Javi
custom_meshtastic_tags = Javi, Seeed
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB
build_flags =
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -I variants/esp32s3/diy/seeed-xiao-s3-nicerf1121
  -DBOARD_HAS_PSRAM
