; Seeed XIAO ESP32-S3 + NiceRF LoRa1121F33-2G4 (LR1121 + 30 dBm FEM).
; Local DIY variant (diy- prefix) so it stays distinct from the stock seeed-xiao-s3 env.
[env:diy-seeed-xiao-s3-nicerf1121]
extends = esp32s3_base
board_level = extra
board = seeed-xiao-s3
board_build.partitions = default_8MB.csv
upload_protocol = esptool
upload_speed = 921600
custom_meshtastic_hw_model = 81
custom_meshtastic_hw_model_slug = SEEED_XIAO_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_display_name = Javi
custom_meshtastic_tags = Javi, Seeed
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 8MB
build_flags =
  ${esp32s3_base.build_flags}
  -D SEEED_XIAO_S3
  -I variants/esp32s3/diy/seeed-xiao-s3-nicerf1121
  -DBOARD_HAS_PSRAM

; Native microReticulum transport node (LR1121; 0x1B hybrid syncword).
[env:diy-seeed-xiao-s3-nicerf1121-mrrns]
extends = env:diy-seeed-xiao-s3-nicerf1121
board_level = extra
lib_deps =
  ${env:diy-seeed-xiao-s3-nicerf1121.lib_deps}
  https://github.com/attermann/microReticulum/archive/40fa628809d57140180c1c833559ab96fec992c1.zip
  https://github.com/meshtastic/Crypto/archive/1c817c2f27aa4593e07d0f7e13b3dbf8d980bcae.zip
  https://github.com/attermann/microStore/archive/0f28567fe00ab8ab14624a34c2e9e0a000a44c46.zip
build_flags =
  ${env:diy-seeed-xiao-s3-nicerf1121.build_flags}
  -DNEXUS_ENABLE_RNODE=1
  -DNEXUS_ENABLE_MICRORETICULUM=1
  -DNEXUS_ENABLE_RNS_HYBRID_SYNC=1
  -DRNS_USE_FS
  -DUSTORE_USE_UNIVERSALFS
  -DMCU_ESP32
  -DRNG=CryptRNG
  -DMSGPACK_USE_BOOST=OFF
  -DRNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR
  -DRNS_CONTAINER_ALLOCATOR=RNS_PSRAM_ALLOCATOR
