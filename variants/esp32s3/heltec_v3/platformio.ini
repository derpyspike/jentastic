[env:heltec-v3]
custom_meshtastic_hw_model = 43
custom_meshtastic_hw_model_slug = HELTEC_V3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec V3
custom_meshtastic_images = heltec-v3.svg, heltec-v3-case.svg
custom_meshtastic_tags = Heltec
custom_meshtastic_partition_scheme = 8MB
 
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = pr
board_build.partitions = default_8MB.csv
build_flags = 
  ${esp32s3_base.build_flags}
  -D HELTEC_V3
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1   ; (Heltec V3 has no air quality
                                              ;  hardware; explicit exclude
                                              ;  drops the module + 6 sensors)

  ; === JENTASTIC sensor whitelist (Nexus-269, 2026-08-11) ===
  ; Level 3 (TIGHT): keeps only BME/BMP families + INA family. Drop
  ; everything else in src/modules/Telemetry/Sensor/. External sensors
  ; attached via the secondary I2C bus (I2C_SDA1/I2C_SCL1) are still
  ; registered if whitelisted. See src/NexusSensorBudget.h.
  -DNEXUS_SENSOR_PROMICRO_WHITELIST=3

  ; === Mesh cache tier shrink (Nexus-28002, 2026-08-21) ===
  ; Override the runtime flash-size probe to fix MAX_NUM_NODES at 100.
  ; The ESP.getFlashChipSize()-based heuristic in
  ; mesh-pb-constants.h:109-122 returns 200 for the 8MB Heltec V3 chip.
  ; The Nexus Heltec V3 profile trims that to 100 for smaller-mesh field
  ; deployments. PACKETHISTORY_MAX derives from this as max(200, 100)=200.
  -DMAX_NUM_NODES=100

  ; Disable Traffic Management module. Drops TRAFFIC_MANAGEMENT_CACHE_SIZE
  ; to 0 (saves ~5 KB heap) and compiles out the NextHopRouter.cpp TMM
  ; routing paths. Nexus's TM command handler at NexusCommands.cpp:7455 is
  ; already #if HAS_TRAFFIC_MANAGEMENT guarded so no Nexus regression.
  -DHAS_TRAFFIC_MANAGEMENT=0

  ; Disable all four satellite NodeDB stores (position, telemetry,
  ; environment, status). Each is its own ifndef-guarded macro in
  ; mesh-pb-constants.h:66-95. These compile out the satellite protobuf
  ; storage; the main nodeDatabase hot store is unaffected.
  -DMESHTASTIC_EXCLUDE_POSITIONDB=1
  -DMESHTASTIC_EXCLUDE_TELEMETRYDB=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTDB=1
  -DMESHTASTIC_EXCLUDE_STATUSDB=1

  -I variants/esp32s3/heltec_v3
