[env:station-g3]
custom_meshtastic_hw_model = 134
custom_meshtastic_hw_model_slug = STATION_G3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 2
custom_meshtastic_display_name = Station G3
custom_meshtastic_images = station-g3.svg
custom_meshtastic_tags = B&Q
custom_meshtastic_requires_dfu = true
custom_meshtastic_partition_scheme = 16MB

extends = esp32s3_base
board_level = release
board = station-g3
board_build.partitions = default_16MB.csv
board_build.mcu = esp32s3
upload_protocol = esptool
;upload_port = /dev/ttyACM0
upload_speed = 921600
build_unflags =
  ${esp32s3_base.build_unflags}
  -DARDUINO_USB_MODE=0
build_flags =
  ${esp32s3_base.build_flags}
  -D STATION_G3
  -I variants/esp32s3/station-g3
  -I variants/esp32s3/station-common
  -DBOARD_HAS_PSRAM
  -DSTATION_G3
  -DARDUINO_USB_MODE=1

; Experimental native microReticulum transport node. Kept out of the normal
; CI/release matrix (board_level = extra); build explicitly with
; ./build-nexus.sh jenny --targets station-g3-mrrns --microreticulum.
[env:station-g3-mrrns]
extends = env:station-g3
board_level = extra
lib_deps =
  ${env:station-g3.lib_deps}
  ; renovate: datasource=git-refs depName=microReticulum packageName=https://github.com/attermann/microReticulum gitBranch=main
  https://github.com/attermann/microReticulum/archive/40fa628809d57140180c1c833559ab96fec992c1.zip
  ; microReticulum 0.5.0 expects these dependency revisions (the unpinned
  ; library.json URLs resolve to newer, API-incompatible heads).
  https://github.com/meshtastic/Crypto/archive/1c817c2f27aa4593e07d0f7e13b3dbf8d980bcae.zip
  https://github.com/attermann/microStore/archive/0f28567fe00ab8ab14624a34c2e9e0a000a44c46.zip
build_flags =
  ${env:station-g3.build_flags}
  -DNEXUS_ENABLE_RNODE=1
  -DNEXUS_ENABLE_MICRORETICULUM=1
  -DRNS_USE_FS
  -DUSTORE_USE_UNIVERSALFS
  -DMCU_ESP32
  -DRNG=CryptRNG
  -DMSGPACK_USE_BOOST=OFF
  -DRNS_DEFAULT_ALLOCATOR=RNS_PSRAM_ALLOCATOR
  -DRNS_CONTAINER_ALLOCATOR=RNS_PSRAM_ALLOCATOR
