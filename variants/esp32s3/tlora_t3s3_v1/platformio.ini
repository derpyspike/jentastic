[env:tlora-t3s3-v1]
custom_meshtastic_hw_model = 16
custom_meshtastic_hw_model_slug = TLORA_T3_S3
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = LILYGO T-LoRa T3-S3
custom_meshtastic_images = tlora-t3s3-v1.svg
custom_meshtastic_tags = LilyGo
custom_meshtastic_requires_dfu = true

extends = esp32s3_base
board_level = release
board = tlora-t3s3-v1
board_build.partitions = partition-table-t3s3.csv
upload_protocol = esptool

build_flags =
  ${esp32s3_base.build_flags}
  -D TLORA_T3S3_V1
  -I variants/esp32s3/tlora_t3s3_v1
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
  -DMESHTASTIC_EXCLUDE_RANGE_TEST=1
#  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
