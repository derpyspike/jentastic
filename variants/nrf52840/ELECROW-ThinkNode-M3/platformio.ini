[env:thinknode_m3]
custom_meshtastic_support_level = 1
custom_meshtastic_images = thinknode_m3.svg
custom_meshtastic_tags = Elecrow

extends = nrf52840_base
board_level = release
board = ThinkNode-M3
debug_tool = jlink
custom_meshtastic_hw_model = 115
custom_meshtastic_hw_model_slug = THINKNODE_M3
custom_meshtastic_architecture = nrf52840
custom_meshtastic_display_name = Elecrow ThinkNode M3
custom_meshtastic_actively_supported = true
build_flags = 
  ${nrf52840_base.build_flags} 
  -Ivariants/nrf52840/ELECROW-ThinkNode-M3
  -DELECROW_ThinkNode_M3
  -DGPS_POWER_TOGGLE
  -D CONFIG_NFCT_PINS_AS_GPIOS=1
  ; Jentastic flash diet for this board (keeps Traffic Management, Beacon and DEBUG logs).
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -DEXCLUDE_EMOJI=1
  -DMESHTASTIC_EXCLUDE_STATUSDB=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -DMESHTASTIC_EXCLUDE_TZ=1
  -DMESHTASTIC_EXCLUDE_FILES_MANIFEST=1
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/ELECROW-ThinkNode-M3>
lib_deps = 
  ${nrf52840_base.lib_deps}
  # renovate: datasource=custom.pio depName=nRF52_PWM packageName=khoih-prog/library/nRF52_PWM
  khoih-prog/nRF52_PWM@1.0.1
  # renovate: datasource=git-refs depName=meshtastic-PCF8xRTC packageName=https://github.com/meshtastic/PCF8xRTC gitBranch=main
  https://github.com/meshtastic/PCF8xRTC/archive/efe1d9c92f79d8413f8ac4e9bdce0c48410600de.zip
