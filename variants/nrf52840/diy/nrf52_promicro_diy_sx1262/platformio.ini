; Promicro + SX1262 modules board variant - DIY - with TCXO
[env:nrf52_promicro_diy_sx1262]
custom_meshtastic_hw_model = 63
custom_meshtastic_hw_model_slug = NRF52_PROMICRO_DIY
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 3
custom_meshtastic_display_name = NRF52 Pro-micro DIY
custom_meshtastic_images = promicro.svg
custom_meshtastic_tags = DIY
custom_meshtastic_requires_dfu = true

extends = nrf52840_base
board_level = release
board = promicro-nrf52840
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_sx1262
  -D NRF52_PROMICRO_DIY
  -DMESHTASTIC_EXCLUDE_POSITIONDB=1
  -DMESHTASTIC_EXCLUDE_TELEMETRYDB=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTDB=1

  ; === Headless optimization (~63 KB savings) ===
  ; Required to fit 1 MB nRF52840 flash on this variant. All excludes
  ; are safe for a headless DIY ProMicro + SX1262 node (no display, no
  ; UI, no sensors, no GPS).
  ;
  ; Nexus-critical excludes deliberately left OFF:
  ;   TRACEROUTE  - Nexus /nexus TRACE depends on it
  ;   TEXTMESSAGE - Nexus /nexus CLI over port 1
  ;   ADMIN       - Nexus config get/set
  ;   SERIAL      - serial console + logs
  ;   PKI         - DM encryption
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1             ; waypoints UI module
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1             ; auto-reply module
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1         ; store-and-forward + flash cache
  -DMESHTASTIC_EXCLUDE_RANGE_TEST=1           ; range test module
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1     ; health sensor path (MAX30102)
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1   ; air quality sensors (PMS/SCD/SEN)
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1         ; neighbor info module
  -DMESHTASTIC_EXCLUDE_ATAK=1                 ; ATAK plugin
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1       ; remote GPIO control module
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1 ; external notification (buzzer/LED)
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1       ; canned message UI
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1           ; paxcounter (no-op on nRF52)
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1      ; detection sensor module
  -DMESHTASTIC_EXCLUDE_AUDIO=1                ; audio module (no-op on nRF52, future-proof)
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1          ; power stress test module
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1        ; LIS3DH motion sensor (3-axis)
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1         ; magnetometer (QMC5883L etc.)

  ; === JENTASTIC sensor whitelist (Nexus-269, 2026-08-11) ===
  ; Migrated to the NEXUS_SENSOR_PROMICRO_WHITELIST umbrella in
  ; src/NexusSensorBudget.h (Level 3 = TIGHT). Replaces 22 individual
  ; -D JENTASTIC_EXCLUDE_* flags. Keeps BME/BMP families (no BME680) +
  ; INA family; drops everything else in src/modules/Telemetry/Sensor/.
  ; See src/NexusSensorBudget.h for the canonical list and tier
  ; semantics (LITE=1, MEDIUM=2, TIGHT=3).
  -DNEXUS_SENSOR_PROMICRO_WHITELIST=3         ; TIGHT (BME/BMP + INA only)

  ; === I2C exclude (test build, 2026-08-12) ===
  ; TEST ONLY — DISABLED: full upstream MESHTASTIC_EXCLUDE_I2C implementation
  ; is incomplete (half-gated, half-undefined symbols).
  ;
  ; Compile fix attempted (2026-08-12): wrap InputBroker.cpp:386-389 in
  ; `#if !MESHTASTIC_EXCLUDE_I2C`. Compile succeeds.
  ;
  ; Link fix needed (out of scope for a quick test): multiple
  ; always-compiled translation units reference symbols whose
  ; definitions are inside `!MESHTASTIC_EXCLUDE_I2C` blocks:
  ;   - nodeTelemetrySensorsMap (TelemetrySensor.h:17 extern,
  ;     defined in EnvironmentTelemetry.cpp inside I2C gate)
  ;   - max17048Sensor (power.h:71 extern with NullSensor fallback,
  ;     but Power.cpp:128 definition is inside I2C gate)
  ;   - BME280/BMP085/BMP280/BMP3XX/INA219/INA226 sensor .cpp files
  ;     don't have a top-level I2C gate and reach for missing symbols
  ;
  ; Properly fixing this requires:
  ;   1. Adding a stub `nodeTelemetrySensorsMap` definition under I2C
  ;      gate, OR gating the consuming sensor initDevice() calls.
  ;   2. Always compiling the `NullSensor max17048Sensor` definition
  ;      in Power.cpp when I2C excluded.
  ;   3. Either gating all sensor source files at the top, or
  ;      ensuring all symbols they reference have non-I2C definitions.
  ;
  ; Per Golden Rule #1 (no autonomous refactoring), reverting both the
  ; InputBroker.cpp gate AND the variant build flag. Tree is buildable.
  ;-DMESHTASTIC_EXCLUDE_I2C=1

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/diy/nrf52_promicro_diy_sx1262>
debug_tool = jlink

; NRF52 ProMicro w/ E-Ink display (SX1262)
[env:nrf52_promicro_diy_sx1262-inkhud]
board_level = extra
extends = nrf52840_base, inkhud
board = promicro-nrf52840
build_flags =
  ${nrf52840_base.build_flags}
  ${inkhud.build_flags}
  -I variants/nrf52840/diy/nrf52_promicro_diy_sx1262
  -D NRF52_PROMICRO_DIY
  -DMESHTASTIC_EXCLUDE_POSITIONDB=1
  -DMESHTASTIC_EXCLUDE_TELEMETRYDB=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTDB=1
build_src_filter =
  ${nrf52_base.build_src_filter}
  ${inkhud.build_src_filter}
  +<../variants/nrf52840/diy/nrf52_promicro_diy_sx1262>
lib_deps =
  ${inkhud.lib_deps} ; InkHUD libs first, so we get GFXRoot instead of AdafruitGFX
  ${nrf52840_base.lib_deps}
extra_scripts =
  ${nrf52840_base.extra_scripts}
  variants/nrf52840/diy/nrf52_promicro_diy_sx1262/custom_build_tasks.py ; Add to PIO's Project Tasks pane: preset builds for common displays

; NRF52 ProMicro + SX1262, no display/screen (2026-08-15)
; Explicit alias for the headless build of the base env. The base
; env is already headless (no display libs linked, inkhud not
; extended) — this env is byte-identical to it at build time and
; exists purely so build scripts can target "no-screen" semantics
; by name without changing the default `nrf52_promicro_diy_sx1262`
; target.
;
; Mirrors the existing `nrf52_promicro_diy_sx1262-inkhud` pattern
; (PIO's `extends =` resolves build-group sections, not env
; sections, so variant-specific build_flags / build_src_filter /
; extra_scripts must be duplicated here).
[env:nrf52_promicro_diy_sx1262-noscreen]
board_level = extra
extends = nrf52840_base
board = promicro-nrf52840
build_flags =
  ${nrf52840_base.build_flags}
