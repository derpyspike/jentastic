; First prototype nrf52840/sx1262 device
[env:heltec-mesh-node-t096]
custom_meshtastic_hw_model = 127
custom_meshtastic_hw_model_slug = HELTEC_MESH_NODE_T096
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec Mesh Node 096
custom_meshtastic_images = heltec-mesh-node-t096.svg, heltec-mesh-node-t096-case.svg
custom_meshtastic_tags = Heltec

extends = nrf52840_base
board_level = release
board = heltec_mesh_node_t096
debug_tool = jlink

build_flags = ${nrf52840_base.build_flags}
  -UOLEDDISPLAY_REDUCE_MEMORY ; TFTDisplay.cpp needs the lib's buffer_back for dirty-window diffing
  -Ivariants/nrf52840/heltec_mesh_node_t096
  -D HAS_LORA_FEM=1
  -D HELTEC_MESH_NODE_T096
  -D USE_TFTDISPLAY=1
  -D USER_SETUP_LOADED
  -D ST7735_DRIVER
  -D ST7735_REDTAB160x80
  -D TFT_SPI_PORT=SPI1 
  -D TFT_CS=ST7735_CS  ; Chip select control
  -D TFT_DC=ST7735_RS  ; Data Command control pin
  -D TFT_RST=ST7735_RESET  ; Reset pin
  -D TFT_BL=ST7735_BL  ; LED back-light
  -D TFT_BACKLIGHT_ON=LOW
  ; Jentastic flash diet: no onboard sensors, and the optional modules the boards that fit already drop.
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -DEXCLUDE_EMOJI=1
  -DMESHTASTIC_EXCLUDE_STATUSDB=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTDB=1
  -DMESHTASTIC_EXCLUDE_TELEMETRYDB=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DMESHTASTIC_EXCLUDE_TZ=1
  -DMESHTASTIC_EXCLUDE_FILES_MANIFEST=1
  -DMAX_NUM_NODES=50                          ; 50 tracked peers is plenty; trims node + packet-history stores
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/heltec_mesh_node_t096>
lib_deps = 
  ${nrf52840_base.lib_deps}
  bodmer/TFT_eSPI@2.5.43 ; renovate: datasource=platformio-registry depName=bodmer/TFT_eSPI

; -hybrid subvariant (2026-10-31): shares every build flag of heltec-mesh-node-t096 and
; additionally enables JenCore + RNode the way build-nexus.sh would:
; -DNEXUS_ENABLE_JENCORE=1 -UCRYPTO_AES_NO_DECRYPT -DNEXUS_ENABLE_RNODE=1
[env:heltec-mesh-node-t096-hybrid]
custom_meshtastic_hw_model = 127
custom_meshtastic_hw_model_slug = HELTEC_MESH_NODE_T096
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Heltec Mesh Node 096 Hybrid
custom_meshtastic_requires_dfu = true
custom_meshtastic_images = heltec-mesh-node-t096.svg, heltec-mesh-node-t096-case.svg
custom_meshtastic_tags = Heltec
extends = env:heltec-mesh-node-t096
build_flags =
  ${env:heltec-mesh-node-t096.build_flags}
  -DNEXUS_ENABLE_JENCORE=1
  -UCRYPTO_AES_NO_DECRYPT
  -DNEXUS_ENABLE_RNODE=1
  -DMESHTASTIC_EXCLUDE_DEBUG_LOG=1          ; drop LOG_DEBUG strings for the hybrid fit (~27 KB)
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1 ; no onboard sensors; recovers the rest of the hybrid fit
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_BEACON=1
  -DMESHTASTIC_EXCLUDE_STATUS=1
