; The very slick RAK wireless RAK 4631 / 4630 board - Unified firmware for 5005/19003, with or without OLED RAK 1921
[env:rak3401-1watt]
custom_meshtastic_hw_model = 117
custom_meshtastic_hw_model_slug = RAK3401
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = RAK3401 1W
custom_meshtastic_images = rak3401.svg
custom_meshtastic_tags = RAK
custom_meshtastic_requires_dfu = true

extends = nrf52840_base
board_level = release
board = wiscore_rak4631
build_flags = ${nrf52840_base.build_flags} 
  -Ivariants/nrf52840/rak3401_1watt
  -D RAK_4631
;   -DGPS_POWER_TOGGLE ; comment this line to disable triple press function on the user button to turn off gps entirely.
  -D RAK3401
  -D RAK13302 ; RAK 1Watt Power Amplifier
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DRADIOLIB_EXCLUDE_LR2021=1
  -DMESHTASTIC_EXCLUDE_POSITIONDB=1
  -DMESHTASTIC_EXCLUDE_TELEMETRYDB=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTDB=1

  ; === Headless weight reduction (Nexus-28001, 2026-08-20) ===
  ; Required to fit 815 KB nRF52840 flash on this variant. Tier 2
  ; (MEDIUM) drops air quality + health + detection via the umbrella in
  ; src/NexusSensorBudget.h. Env telemetry stays open (required by
  ; TelemetrySensor.h's OR-guard, and RAK12035 soil moisture is
  ; gated on RAK_4631 inside env telemetry). BMX160 IMU unaffected.
  ;
  ; Nexus-critical excludes deliberately left OFF:
  ;   TRACEROUTE  - Nexus /nexus TRACE depends on it
  ;   TEXTMESSAGE - Nexus /nexus CLI over port 1
  ;   ADMIN       - Nexus config get/set
  ;   SERIAL      - serial console + logs
  ;   PKI         - DM encryption
  ;   ENVIRONMENTAL_SENSOR / POWER_TELEMETRY - would break env
  ;     telemetry scaffolding + RAK12035 sensor path
  ;   ACCELEROMETER / MAGNETOMETER - BMX160 IMU is linked
  ;   GPS - kept (RAK13302 + 1W amp context)
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1             ; waypoints UI module
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1             ; auto-reply module
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1         ; store-and-forward + flash cache
  -DMESHTASTIC_EXCLUDE_RANGETEST=1            ; range test module (NOTE: RANGETEST, not RANGE_TEST — 2026-08-20)
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1         ; neighbor info module
  -DMESHTASTIC_EXCLUDE_ATAK=1                 ; ATAK plugin
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1       ; remote GPIO control module
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1 ; external notification (buzzer/LED)
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1       ; canned message UI
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1           ; paxcounter (no-op on nRF52)
  -DMESHTASTIC_EXCLUDE_AUDIO=1                ; audio module (no-op on nRF52, future-proof)
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1          ; power stress test module
  -DMESHTASTIC_EXCLUDE_SCREEN=1               ; screen I/O + HAS_SCREEN (rak3401 variant.h has no HAS_SCREEN=1 — safe; also gates motion sensors' screen-dependent code paths: BMX160Sensor.cpp, ICM20948Sensor.cpp, BMM150Sensor.cpp, MMC5983MASensor.cpp)
  -DMESHTASTIC_EXCLUDE_DISPLAY=1              ; OLED/TFT graphics libs (no panel). UPSTREAM NO-OP (Nexus-28001, 2026-08-20): grep -r MESHTASTIC_EXCLUDE_DISPLAY src/ returns zero hits; the macro is defined but never read. Kept for forward-compat if upstream lands display gates. Saves zero bytes today — cost is only one -D line in the build_flags.

  ; === NEXUS sensor umbrella (Nexus-28001, 2026-08-20) ===
  ; Tier 3 (HEAVY): drops air quality + health + detection + env + power
  ; telemetry modules via src/NexusSensorBudget.h. RAK12035 soil
  ; moisture sensor becomes orphan code (env telemetry gone, lib_deps
  ; entry intentionally kept for future re-introduction).
#  ;-DNEXUS_SENSOR_WEIGHTREDUCTION=3

  ; === Belt-and-suspenders explicit excludes (Nexus-28001, 2026-08-20) ===
  ; The umbrella's force-define in NexusSensorBudget.h only reaches
  ; TUs that include it (Modules.cpp, NexusModule.cpp,
  ; EnvironmentTelemetry.cpp, AirQualityTelemetry.cpp, power.h,
  ; Power.cpp). ScanI2CTwoWire.cpp does NOT, so its `#if HAS_TELEMETRY
  ; && !MESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR` guard evaluates the
  ; macro as undefined and the SEN5X/SEN6X function bodies try to
  ; reference classes that were gated out by the umbrella's
  ; transitive include via Power.h. This was caught at the
  ; Tier 2 build (2026-08-20) after `SEN6XSensor undeclared`
  ; errors.
  ;
  ; Fix: mirror promicro sx1262's pattern and set the umbrella's
  ; Tier 3 force-defines via command-line `-D` so they reach every
  ; TU. The umbrella becomes redundant but harmless (its
  ; `#ifndef` guards short-circuit on already-defined macros).
#  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1   ; (umbrella Tier 3 also sets this)
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1     ; (umbrella Tier 3 also sets this)
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1      ; (umbrella Tier 3 also sets this)
#  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1 ; (umbrella Tier 3 also sets this)
#  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1      ; (umbrella Tier 3 also sets this)
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/rak3401_1watt> +<mesh/api/>
lib_deps = 
  ${nrf52840_base.lib_deps}
  ${networking_base.lib_deps}
  # renovate: datasource=custom.pio depName=Melopero RV3028 packageName=melopero/library/Melopero RV3028
  melopero/Melopero RV3028@1.2.0
  # renovate: datasource=custom.pio depName=RAK NCP5623 RGB LED packageName=rakwireless/library/RAKwireless NCP5623 RGB LED library
  rakwireless/RAKwireless NCP5623 RGB LED library@1.0.3
  # renovate: datasource=custom.pio depName=RAK12035_SoilMoisture packageName=beegee-tokyo/library/RAK12035_SoilMoisture
  beegee-tokyo/RAK12035_SoilMoisture@1.0.4
  # renovate: datasource=git-refs depName=RAK12034-BMX160 packageName=https://github.com/RAKWireless/RAK12034-BMX160 gitBranch=main
  https://github.com/RAKWireless/RAK12034-BMX160/archive/dcead07ffa267d3c906e9ca4a1330ab989e957e2.zip

; RAK10729 WisMesh Repeater Mini V2 HP (RAK3401 + RAK19007 + RAK13302 + solar battery)
[env:rak_wismesh_repeater_mini_hp]
extends = env:rak3401-1watt
board_level = release
custom_meshtastic_display_name = RAK WisMesh Repeater Mini V2 HP
custom_meshtastic_images = rak3401.svg
build_flags =
  ${env:rak3401-1watt.build_flags}
  -D WISMESH_REPEATER_MINI_HP
  -DMESHTASTIC_EXCLUDE_GPS=1
  -DLOW_VDD_SYSTEMOFF_DELAY_MS=5000
  -DSAFE_VDD_VOLTAGE_THRESHOLD_MV=2900
  -DSAFE_VDD_VOLTAGE_THRESHOLD_HYST_MV=100

; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
; Note: as of 6/2013 the serial/bootloader based programming takes approximately 30 seconds
;upload_protocol = jlink

; Allows programming and debug via the RAK NanoDAP as the default debugger tool for the RAK4631 (it is only $10!)
; programming time is about the same as the bootloader version.
; For information on this see the meshtastic developers documentation for "Development on the NRF52"

