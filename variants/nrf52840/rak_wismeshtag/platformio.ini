; The very slick RAK wireless RAK 4631 / 4630 board - Unified firmware for 5005/19003, with or without OLED RAK 1921
[env:rak_wismeshtag]
custom_meshtastic_support_level = 1
custom_meshtastic_images = rak_wismesh_tag.svg
custom_meshtastic_tags = RAK

extends = nrf52840_base
board_level = release
board = wiscore_rak4631
custom_meshtastic_hw_model = 105
custom_meshtastic_hw_model_slug = WISMESH_TAG
custom_meshtastic_architecture = nrf52840
custom_meshtastic_display_name = RAK WisMesh Tag
custom_meshtastic_actively_supported = true
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/rak_wismeshtag
  -D WISMESH_TAG
  -D RAK_4631
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DRADIOLIB_EXCLUDE_LR2021=1
  -DMESHTASTIC_EXCLUDE_WIFI=1

  ; === Nexus-28003: headless weight reduction (sx1262-noscreen subset) ===
  ; 2026-08-24: apply the safe subset of sx1262-noscreen
  ; excludes, skipping hardware-dependent flags:
  ;   * EXTERNALNOTIFICATION kept enabled — WisMesh Tag has PIN_BUZZER 21
  ;     (variant.h:269); excluding would kill the buzzer alert path.
  ;   * ACCELEROMETER kept enabled — no QMA on WisMesh Tag (no hardware
  ;     conflict; applied for parity with T1000-E).
  ; RADIOLIB_EXCLUDE_* flags above already drop the LR11x0 / LR2021 /
  ; SX127x / SX128x stacks (WisMesh Tag is SX1262-only), so the
  ; 2.4 GHz HF radio path is already gone. The remaining excludes
  ; are nRF52-safe (AudioModule is ESP32+SX1280 only; PAXCOUNTER is
  ; already default). TIGHT just strips MAX17048 / RAK9154 link-time
  ; symbols (neither variant has power-side sensors defined).
  -DMESHTASTIC_EXCLUDE_POSITIONDB=1          ; position DB module (u-blox cache)
  -DMESHTASTIC_EXCLUDE_TELEMETRYDB=1         ; telemetry DB module
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTDB=1       ; environment DB module
  -DMESHTASTIC_EXCLUDE_DISPLAY=1             ; OLED/TFT graphics libs (HAS_SCREEN=0)
  -DMESHTASTIC_EXCLUDE_SCREEN=1              ; screen I/O + HAS_SCREEN
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1            ; waypoints UI module
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1            ; auto-reply module
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1        ; store-and-forward + flash cache
  -DMESHTASTIC_EXCLUDE_RANGE_TEST=1          ; range test module
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1    ; health sensor path (MAX30102)
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1  ; air quality sensors (PMS/SCD/SEN)
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1        ; neighbor info module
  -DMESHTASTIC_EXCLUDE_ATAK=1                ; ATAK plugin
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1      ; remote GPIO control module
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1      ; canned message UI
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1     ; detection sensor module (no DETECTION_SENSOR_EN defined on Tag)
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1         ; power stress test module
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1        ; magnetometer (QMC5883L etc.)

  ; === JENTASTIC sensor whitelist (Nexus-269, 2026-08-11) ===
  ; Mirrors the sx1262-noscreen target. TIGHT (=3) keeps BME/BMP
  ; families + INA family; drops everything else from
  ; src/modules/Telemetry/Sensor/. Net effect on WisMesh Tag:
  ; link-time symbols only (no MAX17048 / RAK9154 power-side sensors
  ; defined in variant.h). See src/NexusSensorBudget.h for tier
  ; semantics.
  -DNEXUS_SENSOR_PROMICRO_WHITELIST=3        ; TIGHT (BME/BMP + INA only)

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/rak_wismeshtag>

; RAK WisMesh Pod - same board as Tag (no user buttons on hardware; shares Tag pin map)
[env:rak_wismesh_pod]
extends = env:rak_wismeshtag
board_level = release
custom_meshtastic_display_name = RAK WisMesh Pod
build_flags =
  ${env:rak_wismeshtag.build_flags}
  -D WISMESH_POD