[env:seeed_mesh_tracker_X1]
custom_meshtastic_support_level = 1
custom_meshtastic_images = seeed_mesh_tracker_x1.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_hw_model = 128
custom_meshtastic_hw_model_slug = MESH_TRACKER_X1
custom_meshtastic_architecture = nrf52840
custom_meshtastic_display_name = Seeed SenseCAP Mesh-Tracker-X1
custom_meshtastic_actively_supported = true

extends = nrf52840_base
board = mesh-tracker-x1
board_level = release
build_flags = ${nrf52840_base.build_flags}
  -Ivariants/nrf52840/seeed_mesh_tracker_X1
  -Isrc/platform/nrf52/softdevice
  -Isrc/platform/nrf52/softdevice/nrf52
  -DMESH_TRACKER_X1
  -DCONFIG_NFCT_PINS_AS_GPIOS=1
#  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_WIFI=1

  ; === Headless weight-reduction subset (mirrored from tracker-t1000-e, 2026-09-01) ===
  ; Same sx1262-noscreen-derived excludes as the T1000-E. DETECTIONSENSOR is
  ; already in the base block above (kept here only for parity; no-op duplicate).
  ; The JENTASTIC sensor-whitelist umbrella (NEXUS_SENSOR_PROMICRO_WHITELIST)
  ; is intentionally omitted (weight-reduction build).
  ;
  ; Nexus-28004 (2026-09-01): POSITIONDB re-enabled with cache cap
  ; MAX_SATELLITE_NODES=10 (below), mirroring the T1000-E change. X1 has
  ; HAS_GPS=1 (Airoha GNSS), so the cached-position phone-replay path is
  ; back. TELEMETRYDB stays excluded.
  -DMESHTASTIC_EXCLUDE_TELEMETRYDB=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTDB=1
  -DMESHTASTIC_EXCLUDE_DISPLAY=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
  -DMESHTASTIC_EXCLUDE_RANGE_TEST=1
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1

  ; === Satellite-payload cache cap (Nexus-28004, 2026-09-01) ===
  ; Per-map cap on nodePositions / nodeTelemetry / nodeEnvironment /
  ; nodeStatus (mesh-pb-constants.h:140-150). Default for nRF52840 is
  ; 40 — shrunk to 10 to keep RAM in check on the X1 with POSITIONDB
  ; re-enabled. Each PositionLite entry is ~44 B, so 10 entries ≈ 440 B
  ; plus map overhead.
  -DMAX_SATELLITE_NODES=10
board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_mesh_tracker_X1>
lib_deps = 
  ${nrf52840_base.lib_deps}
  adafruit/Adafruit DRV2605 Library@1.2.4

debug_tool = jlink
; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
upload_protocol = nrfutil
