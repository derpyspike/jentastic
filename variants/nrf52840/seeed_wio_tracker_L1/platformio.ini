[env:seeed_wio_tracker_L1]
custom_meshtastic_hw_model = 99
custom_meshtastic_hw_model_slug = SEEED_WIO_TRACKER_L1
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed Wio Tracker L1
custom_meshtastic_images = wio_tracker_l1_case.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true

board = seeed_wio_tracker_L1
board_level = pr
extends = nrf52840_base
build_flags = ${nrf52840_base.build_flags} 
  -I variants/nrf52840/seeed_wio_tracker_L1
  -D SEEED_WIO_TRACKER_L1
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52

  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -DMESHTASTIC_EXCLUDE_WIFI=1
  -DMESHTASTIC_EXCLUDE_POSITIONDB=1          ; position DB module (u-blox cache)
  -DMESHTASTIC_EXCLUDE_TELEMETRYDB=1         ; telemetry DB module
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTDB=1       ; environment DB module
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1            ; waypoints UI module
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1            ; auto-reply module
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1        ; store-and-forward + flash cache
  -DMESHTASTIC_EXCLUDE_RANGETEST=1          ; range test module
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1    ; health sensor path (MAX30102)
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1  ; air quality sensors (PMS/SCD/SEN)
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1        ; neighbor info module
  -DMESHTASTIC_EXCLUDE_ATAK=1                ; ATAK plugin
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1      ; remote GPIO control module
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1     ; detection sensor module (no DETECTION_SENSOR_EN defined; user-configurable monitor_pin path)
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1         ; power stress test module
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1        ; magnetometer (QMC5883L etc.)
  -DMESHTASTIC_EXCLUDE_DEBUG_LOG=1            ; real macro (NO_DEBUG_LOG was a no-op): drops LOG_DEBUG strings (~27 KB on nRF52)
  ; Flash diet for gates-ON builds (2026-10-25, A2+A3): JenCore+RNode
  ; overflowed FLASH by 9,128 B with the original exclude set above.
  -DMESHTASTIC_EXCLUDE_DROPZONE=1             ; dropzone file-transfer module
  -DMESHTASTIC_EXCLUDE_GENERIC_THREAD_MODULE=1 ; generic threads module
  -DMESHTASTIC_EXCLUDE_BEACON=1               ; mesh beacon module
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1           ; pax counter
  -DEXCLUDE_EMOJI=1                           ; no emote bitmaps/table (2026-10-25; empties emotes[] so renderer no-ops)

  ; === JENTASTIC sensor whitelist (Nexus-269, 2026-08-11) ===
  ; Mirrors the sx1262-noscreen target. TIGHT (=3) keeps BME/BMP
  ; families + INA family; drops everything else from
  ; src/modules/Telemetry/Sensor/. Net effect on T1000-E: link-time
  ; symbols only (no MAX17048 / RAK9154 power-side sensors defined in
  ; variant.h). See src/NexusSensorBudget.h for tier semantics.
  -DNEXUS_SENSOR_PROMICRO_WHITELIST=3        ; TIGHT (BME/BMP + INA only)

  ; === Gates-ON fit: JenCore + RNode + NEXUS_PRIVATE_BUILD (2026-11-04) ===
  ; With the real debug-log exclusion above the link still overflowed by
  ; ~19 KB. Env/power telemetry is the big one (external BME/BMP/INA support
  ; off); the rest are small trims. RTTTL stays; only Chirpy and the hidden
  ; Number Picker are dropped. Final image 797,064 B, ~1 KB clear of the
  ; warm region.
  -DMAX_NUM_NODES=50                          ; 50 tracked peers is plenty; trims node + packet-history stores
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_TZ=1
  -DMESHTASTIC_EXCLUDE_FILES_MANIFEST=1
  -DMESHTASTIC_EXCLUDE_STATUS=1               ; status-message module + its UI entries
  -DNEXUS_EXCLUDE_UI_CHIRPY=1                 ; hidden easter-egg frame
  -DNEXUS_EXCLUDE_UI_NUMBER_PICKER=1          ; Hidden Test Menu "Verify Nodenum" picker
  -DNEXUS_EXCLUDE_UI_FAVORITES=1              ; per-favorite frames (too many favorites to navigate)


board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_wio_tracker_L1>
debug_tool = jlink

; -hybrid subvariant (2026-11-04): shares every build flag of seeed_wio_tracker_L1 and
; additionally enables JenCore + RNode the way build-nexus.sh would:
; -DNEXUS_ENABLE_JENCORE=1 -UCRYPTO_AES_NO_DECRYPT -DNEXUS_ENABLE_RNODE=1
[env:seeed_wio_tracker_L1-hybrid]
custom_meshtastic_hw_model = 99
custom_meshtastic_hw_model_slug = SEEED_WIO_TRACKER_L1
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed Wio Tracker L1 Hybrid
custom_meshtastic_images = wio_tracker_l1_case.svg
custom_meshtastic_tags = Seeed
custom_meshtastic_requires_dfu = true
extends = env:seeed_wio_tracker_L1
build_flags =
  ${env:seeed_wio_tracker_L1.build_flags}
  -DNEXUS_ENABLE_JENCORE=1
  -UCRYPTO_AES_NO_DECRYPT
  -DNEXUS_ENABLE_RNODE=1
