; Seeed Xiao BLE: https://wiki.seeedstudio.com/XIAO_BLE/
[env:seeed_xiao_nrf52840_kit]
custom_meshtastic_hw_model = 88
custom_meshtastic_hw_model_slug = XIAO_NRF52_KIT
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = Seeed Xiao NRF52840 Kit
custom_meshtastic_images = seeed_xiao_nrf52_kit.svg
custom_meshtastic_tags = Seeed

extends = nrf52840_base
board_level = release
board = xiao_ble_sense
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/seeed_xiao_nrf52840_kit
  -I src/platform/nrf52/softdevice
  -I src/platform/nrf52/softdevice/nrf52
  -DSEEED_XIAO_NRF52840_KIT
  -DSEEED_XIAO_NRF_KIT_DEFAULT
  -DCONFIG_NFCT_PINS_AS_GPIOS=1
  -DMESHTASTIC_EXCLUDE_POSITIONDB=1
  -DMESHTASTIC_EXCLUDE_TELEMETRYDB=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTDB=1
  -DMESHTASTIC_EXCLUDE_DISPLAY=1             ; OLED/TFT graphics libs (no panel)
  -DMESHTASTIC_EXCLUDE_SCREEN=1              ; screen I/O + HAS_SCREEN
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1             ; waypoints UI module
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1             ; auto-reply module
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1         ; store-and-forward + flash cache
  -DMESHTASTIC_EXCLUDE_RANGETEST=1           ; range test module
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1     ; health sensor path (MAX30102)
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1   ; air quality sensors (PMS/SCD/SEN)
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1         ; neighbor info module
  -DMESHTASTIC_EXCLUDE_ATAK=1                 ; ATAK plugin
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1       ; remote GPIO control module
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1 ; external notification (buzzer/LED)
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1       ; canned message UI
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1           ; paxcounter (no-op on nRF52)
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1      ; detection sensor module
  -DMESHTASTIC_EXCLUDE_AUDIO=1                ; audio module (no-op on nRF52, future-proof)
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1          ; power stress test module
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1        ; LIS3DH motion sensor (3-axis)
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1         ; magnetometer (QMC5883L etc.)
  -DNEXUS_SENSOR_PROMICRO_WHITELIST=3         ; TIGHT (BME/BMP + INA only)

board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/seeed_xiao_nrf52840_kit>
debug_tool = jlink
; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
;upload_protocol = jlink

; Seeed Xiao BLE but with GPS moved to NFC pins, and therefore i2c active
[env:seeed_xiao_nrf52840_kit_i2c]
extends = env:seeed_xiao_nrf52840_kit
board_level = extra
build_flags = ${env:seeed_xiao_nrf52840_kit.build_flags}
  -DSEEED_XIAO_NRF52840_KIT
  -DSEEED_XIAO_NRF_KIT_I2C     ; Define I2C variant
  -USEEED_XIAO_NRF_KIT_DEFAULT ; Remove default define
