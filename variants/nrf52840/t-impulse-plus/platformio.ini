[env:t-impulse-plus]
custom_meshtastic_hw_model = 135
custom_meshtastic_hw_model_slug = T_IMPULSE_PLUS
custom_meshtastic_architecture = nrf52840
custom_meshtastic_actively_supported = true
custom_meshtastic_support_level = 1
custom_meshtastic_display_name = LILYGO T-Impulse Plus
custom_meshtastic_tags = LilyGo
custom_meshtastic_requires_dfu = true

extends = nrf52840_base
board_level = release
board = t-impulse-plus

build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/t-impulse-plus
  -D T_IMPULSE_PLUS
  ; Jentastic flash diet for this board (keeps Traffic Management, Beacon and DEBUG logs).
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -DEXCLUDE_EMOJI=1
  -DMESHTASTIC_EXCLUDE_STATUSDB=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -DMESHTASTIC_EXCLUDE_TZ=1
  -DMESHTASTIC_EXCLUDE_FILES_MANIFEST=1

build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/t-impulse-plus>
