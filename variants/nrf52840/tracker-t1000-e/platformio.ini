[env:tracker-t1000-e]
custom_meshtastic_support_level = 1
custom_meshtastic_images = tracker-t1000-e.svg
custom_meshtastic_tags = Seeed

extends = nrf52840_base
board = tracker-t1000-e
board_level = pr
custom_meshtastic_hw_model = 71
custom_meshtastic_hw_model_slug = TRACKER_T1000_E
custom_meshtastic_architecture = nrf52840
custom_meshtastic_display_name = Seeed SenseCAP T1000-E
custom_meshtastic_actively_supported = true
build_flags = ${nrf52840_base.build_flags}
  -DNEXUS_ENABLE_AIRTAG
  -Ivariants/nrf52840/tracker-t1000-e
  -Isrc/platform/nrf52/softdevice
  -Isrc/platform/nrf52/softdevice/nrf52
  -DTRACKER_T1000_E
  ; Nexus-269: Sensor weight-reduction umbrella removed 2026-08-11.
  ; The T1000-E has no onboard sensors defined in variant.h (only the
  ; QMA6100P motion sensor in lib_deps + analog battery voltage). The
  ; intent is to keep T1000-E flexible so users can attach external
  ; sensors (BME280, SCD30, MAX30102, etc.) via the secondary I2C bus.
  ; NEXUS_SENSOR_WEIGHTREDUCTION=2 was applied as a demonstration
  ; target on 2026-08-10 but blocks external sensor registration.
  ; See src/NexusSensorBudget.h for the umbrella definitions.
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR_EXTERNAL=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_WIFI=1

  ; === Nexus-28003: headless weight reduction (sx1262-noscreen subset) ===
  ; 2026-08-24: apply the safe subset of sx1262-noscreen
  ; excludes, skipping hardware-dependent flags:
  ;   * EXTERNALNOTIFICATION kept enabled — T1000-E has PIN_BUZZER +
  ;     BUZZER_EN_PIN (variant.h:147-148); excluding would kill the
  ;     buzzer alert path (EnvironmentalTelemetry.cpp:612 fires the
  ;     buzzer via ExternalNotificationModule).
  ;   * ACCELEROMETER kept enabled — T1000-E has QMA6100P for tilt-based
  ;     motion wake (BUZZER_EN_PIN pulled high at variant.cpp:43-44; the
  ;     QMA6100P itself is in lib_deps for tilt detection). Excluding
  ;     would drop tilt wake.
  ; The remaining flags are nRF52-safe (no-op on AudioModule which is
  ; ESP32+SX1280 only; PAXCOUNTER is already default). TIGHT just
  ; strips MAX17048 / RAK9154 link-time symbols (neither variant has
  ; power-side sensors defined).
  ;
  ; Nexus-28004 (2026-09-01): POSITIONDB re-enabled, capped at
  ; MAX_SATELLITE_NODES=10 (below) — operators wanted the cached
  ; phone-replay path back, but constrained to ~10 nodes of satellite
  ; payload to keep RAM in budget. TELEMETRYDB stays excluded.
  -DMESHTASTIC_EXCLUDE_TELEMETRYDB=1         ; telemetry DB module (kept off, RAM saver)
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTDB=1       ; environment DB module
  -DMESHTASTIC_EXCLUDE_DISPLAY=1             ; OLED/TFT graphics libs (HAS_SCREEN=0)
  -DMESHTASTIC_EXCLUDE_WAYPOINT=1            ; waypoints UI module
  -DMESHTASTIC_EXCLUDE_REPLYBOT=1            ; auto-reply module
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1        ; store-and-forward + flash cache
  -DMESHTASTIC_EXCLUDE_RANGE_TEST=1          ; range test module
  -DMESHTASTIC_EXCLUDE_HEALTH_TELEMETRY=1    ; health sensor path (MAX30102)
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1  ; air quality sensors (PMS/SCD/SEN)
  -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1        ; neighbor info module
  -DMESHTASTIC_EXCLUDE_ATAK=1                ; ATAK plugin
  -DMESHTASTIC_EXCLUDE_REMOTEHARDWARE=1      ; remote GPIO control module
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1     ; detection sensor module (no DETECTION_SENSOR_EN defined; user-configurable monitor_pin path)
  -DMESHTASTIC_EXCLUDE_POWERSTRESS=1         ; power stress test module
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1        ; magnetometer (QMC5883L etc.)

  ; === JENTASTIC sensor whitelist (Nexus-269, 2026-08-11) ===
  ; Mirrors the sx1262-noscreen target. TIGHT (=3) keeps BME/BMP
  ; families + INA family; drops everything else from
  ; src/modules/Telemetry/Sensor/. Net effect on T1000-E: link-time
  ; symbols only (no MAX17048 / RAK9154 power-side sensors defined in
  ; variant.h). See src/NexusSensorBudget.h for tier semantics.
  -DNEXUS_SENSOR_PROMICRO_WHITELIST=3        ; TIGHT (BME/BMP + INA only)

  ; === Satellite-payload cache cap (Nexus-28004, 2026-09-01) ===
  ; Per-map cap on nodePositions / nodeTelemetry / nodeEnvironment /
  ; nodeStatus (mesh-pb-constants.h:140-150). Default for nRF52840 is
  ; 40 — too rich for the T1000-E's payload budget when POSITIONDB is
  ; re-enabled, so we shrink it to 10 to keep RAM in check. Each
  ; PositionLite entry is ~44 B, so 10 entries ≈ 440 B plus map overhead.
  -DMAX_SATELLITE_NODES=10

board_build.ldscript = src/platform/nrf52/nrf52840_s140_v7.ld
build_src_filter = ${nrf52_base.build_src_filter} +<../variants/nrf52840/tracker-t1000-e>
lib_deps = 
  ${nrf52840_base.lib_deps}
  # TODO renovate
  https://github.com/meshtastic/QMA6100P_Arduino_Library/archive/14c900b8b2e4feaac5007a7e41e0c1b7f0841136.zip
debug_tool = jlink
; If not set we will default to uploading over serial (first it forces bootloader entry by talking 1200bps to cdcacm)
upload_protocol = nrfutil
